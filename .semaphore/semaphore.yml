version: v1.0
name: Semaphore Render Test
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2204
execution_time_limit:
  hours: 1
blocks:
  - name: Remotion render proof
    task:
      jobs:
        - name: Still + video render
          commands:
            - checkout
            - node --version && npm --version
            - sudo apt-get update -y || apt-get update -y
            - sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2 libpango-1.0-0 libcairo2 ffmpeg || apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2 libpango-1.0-0 libcairo2 ffmpeg
            - ffmpeg -version | head -1
            - npm install
            - npm run still
            - npm run render
            - ls -la out/
            - artifact push workflow out || echo "artifact push not available, continuing"
